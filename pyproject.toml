[project]
name = "a2a-multiagent-langgraph-cicd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.3.22",
    "black>=25.9.0",
    "click>=8.2.1",
    "flake8>=7.3.0",
    "google-adk>=1.25.1",
    "google-auth-oauthlib>=1.2.2",
    "google-auth[openid]>=2.40.3",
    "google-cloud-aiplatform>=1.130.0",
    "google-genai>=1.36.0",
    "gradio>=5.46.1",
    "ipykernel>=6.30.1",
    "langchain-google-genai>=2.1.12",
    "langchain-google-vertexai>=2.1.2",
    "langchain-mcp-adapters>=0.1.11",
    "langgraph>=0.6.8",
    "nbqa>=1.9.1",
    "pip>=25.2",
    "python-dotenv>=1.0.0",
    "google-cloud-logging>=3.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "fastmcp>=2.8.0",
    "geopy>=2.4.1",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require running services)",
]


