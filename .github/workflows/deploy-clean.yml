name: Deploy from Scratch (Clean)

on:
  workflow_dispatch:
    inputs:
      clean_terraform_state:
        description: 'Clean Terraform state before deployment'
        required: true
        type: boolean
        default: true

env:
  REGION: us-central1
  SERVICE_NAME: a2a-frontend-lg

jobs:
  deploy-clean-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      REPOSITORY_OWNER: ${{ vars.REPOSITORY_OWNER }}
      GE_APP_STAGING: ${{ vars.GE_APP_STAGING }}
      OAUTH_CLIENT_ID_SECRET_NAME: ${{ vars.OAUTH_CLIENT_ID_SECRET_NAME }}
      AUTH_ID: ${{ vars.AUTH_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Clean up Terraform state if requested
      - name: Clean Terraform State
        if: github.event.inputs.clean_terraform_state == 'true'
        run: |
          echo "Cleaning Terraform state..."
          gcloud storage rm gs://${{ env.PROJECT_ID }}-terraform-state/a2a-multiagent-langgraph-cicd/staging/default.tfstate || echo "State file not found, continuing..."

      # Step 1: Deploy MCP Servers
      - name: Deploy Cocktail MCP Server
        run: |
          echo "Deploying Cocktail MCP Server..."
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        run: |
          echo "Deploying Weather MCP Server..."
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      # Step 2: Deploy A2A Agents
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv venv
          uv pip install keyrings.google-artifactregistry-auth \
            --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/
          uv pip install -e . \
            --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/

      - name: Deploy A2A Agents
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          ENVIRONMENT: staging
          CT_MCP_SERVER_URL: 'https://cocktail-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src
        run: |
          echo "Deploying A2A Agents (Cocktail, Weather, Hosting)..."
          .venv/bin/python deployment/deploy_agents.py

      # Step 3: Deploy Frontend
      - name: Build Frontend Image
        run: |
          echo "Building Frontend Docker image..."
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-lg \
            --project ${{ env.PROJECT_ID }}

      # Step 4: Deploy Infrastructure via Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=a2a-multiagent-langgraph-cicd/staging"
        working-directory: deployment/terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="region=${{ env.REGION }}" \
            -var="repository_name=${{ github.event.repository.name }}" \
            -var="repository_owner=${{ env.REPOSITORY_OWNER }}" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}" \
            -var="oauth_client_id_secret_name=${{ env.OAUTH_CLIENT_ID_SECRET_NAME }}" \
            -var="auth_id=${{ env.AUTH_ID }}" \
            -var="ge_app_staging=${{ env.GE_APP_STAGING }}" \
            -var="agents_region=global"
        working-directory: deployment/terraform

      # Verification
      - name: Verify Deployment
        run: |
          echo "========================================="
          echo "Deployment Complete!"
          echo "========================================="
          echo ""
          echo "Cloud Run Services:"
          gcloud run services list --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format="table(name,status.url)"
          echo ""
          echo "Agent Engines:"
          gcloud ai reasoning-engines list --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format="table(name,displayName)"
          echo ""
          echo "Frontend URL:"
          gcloud run services describe a2a-frontend-lg --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format="value(status.url)"
          echo "========================================="
