name: Deploy from Scratch (Clean)

on:
  workflow_dispatch:
    inputs:
      clean_terraform_state:
        description: 'Clean Terraform state before deployment'
        required: true
        type: boolean
        default: true

env:
  REGION: us-central1

jobs:
  deploy-clean-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: 'write'
      id-token: 'write'

    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      GE_APP_STAGING: ${{ vars.GE_APP_STAGING }}
      OAUTH_CLIENT_ID_SECRET_NAME: ${{ vars.OAUTH_CLIENT_ID_SECRET_NAME }}
      AUTH_ID: ${{ vars.AUTH_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Clean up Terraform state if requested
      - name: Clean Terraform State
        if: github.event.inputs.clean_terraform_state == 'true'
        run: |
          echo "Cleaning Terraform state..."
          gcloud storage rm gs://${{ env.PROJECT_ID }}-terraform-state/a2a-multiagent-langgraph-cicd/staging/default.tfstate || echo "State file not found, continuing..."

      # Step 1: Build Container Images
      - name: Build Cocktail MCP Image
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-mcp-lg:latest \
            --project ${{ env.PROJECT_ID }}

      - name: Build Weather MCP Image
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-mcp-lg:latest \
            --project ${{ env.PROJECT_ID }}

      - name: Build Frontend Image
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-lg:latest \
            --project ${{ env.PROJECT_ID }}

      # Step 2: Terraform Apply (infra shells)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=a2a-multiagent-langgraph-cicd/staging"
        working-directory: deployment/terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="region=${{ env.REGION }}" \
            -var="agent_engine_id=unset" \
            -var="oauth_client_id_secret_name=${{ env.OAUTH_CLIENT_ID_SECRET_NAME }}" \
            -var="auth_id=${{ env.AUTH_ID }}" \
            -var="ge_app_staging=${{ env.GE_APP_STAGING }}" \
            -var="agents_region=global"
        working-directory: deployment/terraform

      # Step 3: Deploy MCP Servers to Cloud Run shells
      - name: Deploy Cocktail MCP Server
        run: |
          gcloud run deploy cocktail-mcp-lg-staging \
            --image gcr.io/${{ env.PROJECT_ID }}/cocktail-mcp-lg:latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        run: |
          gcloud run deploy weather-mcp-lg-staging \
            --image gcr.io/${{ env.PROJECT_ID }}/weather-mcp-lg:latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      # Step 4: Deploy A2A Agents
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install keyrings.google-artifactregistry-auth
          .venv/bin/pip install -e . \
            --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/

      - name: Deploy A2A Agents
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          ENVIRONMENT: staging
          CT_MCP_SERVER_URL: 'https://cocktail-mcp-lg-staging-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-mcp-lg-staging-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src
        run: .venv/bin/python deployment/deploy_agents.py

      - name: Register Agent Engine ID as GitHub Actions Variable
        if: steps.deploy_agents.outputs.AGENT_ENGINE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_ENGINE_ID: ${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}
        run: |
          gh variable set AGENT_ENGINE_ID \
            --body "${AGENT_ENGINE_ID}" \
            --env staging \
            --repo "${{ github.repository }}" \
          && echo "AGENT_ENGINE_ID registered: ${AGENT_ENGINE_ID}" \
          || echo "Could not set variable automatically. Value: ${AGENT_ENGINE_ID}"

      # Step 5: Deploy Frontend
      - name: Deploy Frontend
        run: |
          AGENT_ID="${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}"
          gcloud run deploy a2a-frontend-lg-staging \
            --image gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-lg:latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --set-env-vars "PROJECT_ID=${{ env.PROJECT_ID }},PROJECT_NUMBER=${{ env.PROJECT_NUMBER }},AGENT_ENGINE_ID=${AGENT_ID},GOOGLE_CLOUD_LOCATION=${{ env.REGION }}"

      # Verification
      - name: Verify Deployment
        run: |
          echo "========================================="
          echo "Deployment Complete!"
          echo "========================================="
          echo ""
          echo "Cloud Run Services:"
          gcloud run services list --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format="table(name,status.url)"
          echo ""
          echo "Agent Engines:"
          gcloud ai reasoning-engines list --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format="table(name,displayName)"
          echo "========================================="
