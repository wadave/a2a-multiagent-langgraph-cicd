name: Deploy to Environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tf_prefix:
        required: true
        type: string
      force_deploy_all:
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      REGION: us-central1
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      REPOSITORY_OWNER: ${{ vars.REPOSITORY_OWNER }}
      GE_APP_STAGING: ${{ vars.GE_APP_STAGING }}
      OAUTH_CLIENT_ID_SECRET_NAME: ${{ vars.OAUTH_CLIENT_ID_SECRET_NAME }}
      AUTH_ID: ${{ vars.AUTH_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cocktail_mcp:
              - 'src/mcp_servers/cocktail_mcp_server/**'
            weather_mcp:
              - 'src/mcp_servers/weather_mcp_server/**'
            agents:
              - 'pyproject.toml'
              - 'src/a2a_agents/**'
              - 'deployment/deploy_agents.py'
              - 'deployment/agent_state_manager.py'
              - '.github/workflows/deploy-env.yml'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/deploy-env.yml'
            terraform:
              - 'deployment/terraform/**'
              - '.github/workflows/deploy-env.yml'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github-runner@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Retrieve Agent State
        id: retrieve_state
        run: |
          STATE_URI="gs://${{ env.PROJECT_ID }}-terraform-state/a2a-multiagent-langgraph-cicd/${{ inputs.tf_prefix }}/agent_state.json"

          if gcloud storage cat "${STATE_URI}" > /tmp/agent_state.json 2>/dev/null; then
            HOSTING_AGENT=$(cat /tmp/agent_state.json | jq -r '.agents.hosting.resource_name // empty')
            if [ -n "$HOSTING_AGENT" ]; then
              echo "PERSISTED_AGENT_ENGINE_ID=${HOSTING_AGENT}" >> $GITHUB_OUTPUT
            else
              echo "PERSISTED_AGENT_ENGINE_ID=" >> $GITHUB_OUTPUT
            fi
          else
            echo "PERSISTED_AGENT_ENGINE_ID=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Cocktail MCP Server
        if: steps.changes.outputs.cocktail_mcp == 'true' || inputs.force_deploy_all
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        if: steps.changes.outputs.weather_mcp == 'true' || inputs.force_deploy_all
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      - name: Set up Python
        if: |
          steps.changes.outputs.agents == 'true' ||
          steps.changes.outputs.cocktail_mcp == 'true' ||
          steps.changes.outputs.weather_mcp == 'true' ||
          inputs.force_deploy_all
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: |
          steps.changes.outputs.agents == 'true' ||
          steps.changes.outputs.cocktail_mcp == 'true' ||
          steps.changes.outputs.weather_mcp == 'true' ||
          inputs.force_deploy_all
        run: |
          python -m venv .venv
          .venv/bin/pip install keyrings.google-artifactregistry-auth
          .venv/bin/pip install -e . \
            --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/

      - name: Run A2A Deploy Script
        if: |
          steps.changes.outputs.agents == 'true' ||
          steps.changes.outputs.cocktail_mcp == 'true' ||
          steps.changes.outputs.weather_mcp == 'true' ||
          inputs.force_deploy_all
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          ENVIRONMENT: ${{ inputs.tf_prefix }}
          CT_MCP_SERVER_URL: 'https://cocktail-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src
        run: .venv/bin/python deployment/deploy_agents.py

      - name: Build Frontend Image
        if: steps.changes.outputs.frontend == 'true' || inputs.force_deploy_all
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-lg \
            --project ${{ env.PROJECT_ID }}

      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true' || steps.changes.outputs.frontend == 'true' || inputs.force_deploy_all
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true' || steps.changes.outputs.frontend == 'true' || inputs.force_deploy_all
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }}

      - name: Terraform Init
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true' || steps.changes.outputs.frontend == 'true' || inputs.force_deploy_all
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=a2a-multiagent-langgraph-cicd/${{ inputs.tf_prefix }}"
        working-directory: deployment/terraform

      - name: Terraform Apply
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true' || steps.changes.outputs.frontend == 'true' || inputs.force_deploy_all
        run: |
          AGENT_ID="${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}"
          if [ -z "$AGENT_ID" ]; then
            AGENT_ID="${{ steps.retrieve_state.outputs.PERSISTED_AGENT_ENGINE_ID }}"
          fi

          if [ -z "$AGENT_ID" ] || [ "$AGENT_ID" == "unset" ]; then
            echo "ERROR: No valid agent ID available. Run the deploy-clean workflow first."
            exit 1
          fi

          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="region=${{ env.REGION }}" \
            -var="repository_name=${{ github.event.repository.name }}" \
            -var="repository_owner=${{ env.REPOSITORY_OWNER }}" \
            -var="agent_engine_id=${AGENT_ID}" \
            -var="oauth_client_id_secret_name=${{ env.OAUTH_CLIENT_ID_SECRET_NAME }}" \
            -var="auth_id=${{ env.AUTH_ID }}" \
            -var="ge_app_staging=${{ env.GE_APP_STAGING }}" \
            -var="agents_region=global"
        working-directory: deployment/terraform

      - name: Force Cocktail MCP Server Update
        if: steps.changes.outputs.cocktail_mcp == 'true' || inputs.force_deploy_all
        run: |
          gcloud run services update cocktail-remote-mcp-server-lg \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --image=gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-lg:latest

      - name: Force Weather MCP Server Update
        if: steps.changes.outputs.weather_mcp == 'true' || inputs.force_deploy_all
        run: |
          gcloud run services update weather-remote-mcp-server-lg \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --image=gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-lg:latest

      - name: Force Frontend Update
        if: steps.changes.outputs.frontend == 'true' || inputs.force_deploy_all
        run: |
          gcloud run services update a2a-frontend-lg \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --image=gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-lg:latest
