name: Deploy A2A Multiagent App

on:
  push:
    branches:
      - staging
      - main

env:
  REGION: us-central1
  SERVICE_NAME: a2a-frontend
  PYTHON_VERSION: '3.12'

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: dw-genai-prod
      PROJECT_NUMBER: '101916374866'
      WORKLOAD_IDENTITY_PROVIDER: 'projects/101916374866/locations/global/workloadIdentityPools/github/providers/github-actions'
      SERVICE_ACCOUNT: 'github-runner@dw-genai-prod.iam.gserviceaccount.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Deploy MCP Servers to Cloud Run
      - name: Deploy Cocktail MCP Server
        id: deploy_cocktail_mcp
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        id: deploy_weather_mcp
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      # 3. Deploy A2A Agents
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          echo "machine us-python.pkg.dev login oauth2accesstoken password $(gcloud auth print-access-token)" > ~/.netrc
          pip install uv
          uv sync

      - name: Run A2A Deploy Script
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          CT_MCP_SERVER_URL: 'https://cocktail-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src/a2a_agents
        run: |
          uv run python deployment/deploy_agents.py

      - name: Build Frontend Image
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend \
            --project ${{ env.PROJECT_ID }}

      # 4. Deploy Infrastructure via Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: deployment/terraform
        
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="repository_name=a2a-multiagent-langgraph-cicd" \
            -var="repository_owner=wadave" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}"
        working-directory: deployment/terraform

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: dw-genai-prod
      PROJECT_NUMBER: '101916374866'
      WORKLOAD_IDENTITY_PROVIDER: 'projects/101916374866/locations/global/workloadIdentityPools/github/providers/github-actions'
      SERVICE_ACCOUNT: 'github-runner@dw-genai-prod.iam.gserviceaccount.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Deploy MCP Servers to Cloud Run
      - name: Deploy Cocktail MCP Server
        id: deploy_cocktail_mcp
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        id: deploy_weather_mcp
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      # 3. Deploy A2A Agents
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          echo "machine us-python.pkg.dev login oauth2accesstoken password $(gcloud auth print-access-token)" > ~/.netrc
          pip install uv
          uv sync

      - name: Run A2A Deploy Script
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          CT_MCP_SERVER_URL: 'https://cocktail-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src/a2a_agents
        run: |
          uv run python deployment/deploy_agents.py

      - name: Build Frontend Image
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend \
            --project ${{ env.PROJECT_ID }}

      # 4. Deploy Infrastructure via Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: deployment/terraform
        
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="repository_name=a2a-multiagent-langgraph-cicd" \
            -var="repository_owner=wadave" \
            -var="agent_engine_id=${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}"
        working-directory: deployment/terraform
