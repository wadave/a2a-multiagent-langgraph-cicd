name: Deploy A2A Multiagent App

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: 'Force deploy all components (ignores path filters)'
        required: false
        type: boolean
        default: false

env:
  REGION: us-central1
  SERVICE_NAME: a2a-frontend-lg
  PYTHON_VERSION: '3.12'

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: dw-genai-dev
      PROJECT_NUMBER: '496235138247'
      WORKLOAD_IDENTITY_PROVIDER: 'projects/496235138247/locations/global/workloadIdentityPools/github/providers/github-actions'
      SERVICE_ACCOUNT: 'github-runner@dw-genai-dev.iam.gserviceaccount.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Detect which components have code changes
      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cocktail_mcp:
              - 'src/mcp_servers/cocktail_mcp_server/**'
            weather_mcp:
              - 'src/mcp_servers/weather_mcp_server/**'
            agents:
              - 'pyproject.toml'
              - 'src/a2a_agents/**'
              - 'deployment/deploy_agents.py'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'deployment/terraform/**'

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Retrieve persisted agent state (for Terraform when agents not redeployed)
      - name: Retrieve Agent State
        id: retrieve_state
        run: |
          ENVIRONMENT="${{ github.ref == 'refs/heads/staging' && 'staging' || 'prod' }}"
          STATE_URI="gs://${{ env.PROJECT_ID }}-terraform-state/a2a-multiagent-langgraph-cicd/${ENVIRONMENT}/agent_state.json"

          echo "Attempting to retrieve state from ${STATE_URI}"

          # Try to read state file
          if gcloud storage cat "${STATE_URI}" > /tmp/agent_state.json 2>/dev/null; then
            # Extract hosting agent resource name
            HOSTING_AGENT=$(cat /tmp/agent_state.json | jq -r '.agents.hosting.resource_name // empty')

            if [ -n "$HOSTING_AGENT" ]; then
              echo "Retrieved hosting agent from state: ${HOSTING_AGENT}"
              echo "PERSISTED_AGENT_ENGINE_ID=${HOSTING_AGENT}" >> $GITHUB_OUTPUT
            else
              echo "No hosting agent found in state file"
              echo "PERSISTED_AGENT_ENGINE_ID=" >> $GITHUB_OUTPUT
            fi
          else
            echo "State file not found (first deployment)"
            echo "PERSISTED_AGENT_ENGINE_ID=" >> $GITHUB_OUTPUT
          fi

      # 2. Deploy MCP Servers to Cloud Run (only if code changed)
      - name: Deploy Cocktail MCP Server
        if: steps.changes.outputs.cocktail_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        if: steps.changes.outputs.weather_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      # 3. Deploy A2A Agents (when agent code changes OR when MCP servers change)
      - name: Set up Python
        if: |
          steps.changes.outputs.agents == 'true' ||
          steps.changes.outputs.cocktail_mcp == 'true' ||
          steps.changes.outputs.weather_mcp == 'true' ||
          github.event.inputs.force_deploy_all == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: |
          steps.changes.outputs.agents == 'true' ||
          steps.changes.outputs.cocktail_mcp == 'true' ||
          steps.changes.outputs.weather_mcp == 'true' ||
          github.event.inputs.force_deploy_all == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install keyrings.google-artifactregistry-auth
          .venv/bin/pip install -e . --extra-index-url https://us-python.pkg.dev/artifact-foundry-prod/ah-3p-staging-python/simple/

      - name: Run A2A Deploy Script
        if: |
          steps.changes.outputs.agents == 'true' ||
          steps.changes.outputs.cocktail_mcp == 'true' ||
          steps.changes.outputs.weather_mcp == 'true' ||
          github.event.inputs.force_deploy_all == 'true'
        id: deploy_agents
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          ENVIRONMENT: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'prod' }}
          CT_MCP_SERVER_URL: 'https://cocktail-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          WEA_MCP_SERVER_URL: 'https://weather-remote-mcp-server-lg-${{ env.PROJECT_NUMBER }}.${{ env.REGION }}.run.app/mcp/'
          PYTHONPATH: src
        run: |
          .venv/bin/python deployment/deploy_agents.py

      # 4. Deploy Frontend (only if code changed)
      - name: Build Frontend Image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          gcloud builds submit ./src/frontend \
            --tag gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-lg \
            --project ${{ env.PROJECT_ID }}

      # 5. Deploy Infrastructure via Terraform (only if config changed)
      - name: Setup Terraform
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true' || steps.changes.outputs.frontend == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state bucket exists
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true' || steps.changes.outputs.frontend == 'true'
        run: |
          gcloud storage buckets describe gs://${{ env.PROJECT_ID }}-terraform-state 2>/dev/null || \
          gcloud storage buckets create gs://${{ env.PROJECT_ID }}-terraform-state \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }}

      - name: Terraform Init
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true' || steps.changes.outputs.frontend == 'true'
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-terraform-state" \
            -backend-config="prefix=a2a-multiagent-langgraph-cicd/staging"
        working-directory: deployment/terraform

      - name: Terraform Apply
        if: steps.changes.outputs.terraform == 'true' || steps.changes.outputs.agents == 'true' || steps.changes.outputs.frontend == 'true'
        run: |
          # Use freshly deployed agent ID if available, otherwise use persisted state
          AGENT_ID="${{ steps.deploy_agents.outputs.AGENT_ENGINE_ID }}"
          if [ -z "$AGENT_ID" ]; then
            AGENT_ID="${{ steps.retrieve_state.outputs.PERSISTED_AGENT_ENGINE_ID }}"
            echo "Using persisted agent ID from state: ${AGENT_ID}"
          else
            echo "Using freshly deployed agent ID: ${AGENT_ID}"
          fi

          # Validate agent ID is not empty or "unset"
          if [ -z "$AGENT_ID" ] || [ "$AGENT_ID" == "unset" ]; then
            echo "ERROR: No valid agent ID available. Cannot deploy frontend without hosting agent."
            echo "This is the first deployment. Please run the deploy-clean workflow first."
            exit 1
          fi

          terraform apply -auto-approve \
            -var="cicd_runner_project_id=${{ env.PROJECT_ID }}" \
            -var="staging_project_id=${{ env.PROJECT_ID }}" \
            -var="prod_project_id=${{ env.PROJECT_ID }}" \
            -var="project_number=${{ env.PROJECT_NUMBER }}" \
            -var="repository_name=a2a-multiagent-langgraph-cicd" \
            -var="repository_owner=wadave" \
            -var="agent_engine_id=${AGENT_ID}" \
            -var="oauth_client_id_secret_name=client_secret" \
            -var="auth_id=a2a_langgraph_oauth_token_client_v3" \
            -var="ge_app_staging=enterprise-search-17489269_1748926990192" \
            -var="agents_region=global"
        working-directory: deployment/terraform

      # Force Cloud Run to pull new :latest images when rebuilt
      - name: Force Cocktail MCP Server Update
        if: steps.changes.outputs.cocktail_mcp == 'true'
        run: |
          echo "Forcing Cloud Run to pull new cocktail MCP server image..."
          gcloud run services update cocktail-remote-mcp-server-lg \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --image=gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-lg:latest

      - name: Force Weather MCP Server Update
        if: steps.changes.outputs.weather_mcp == 'true'
        run: |
          echo "Forcing Cloud Run to pull new weather MCP server image..."
          gcloud run services update weather-remote-mcp-server-lg \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --image=gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-lg:latest

      - name: Force Frontend Update
        if: steps.changes.outputs.frontend == 'true'
        run: |
          echo "Forcing Cloud Run to pull new frontend image..."
          gcloud run services update a2a-frontend-lg \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --image=gcr.io/${{ env.PROJECT_ID }}/a2a-frontend-lg:latest

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      PROJECT_ID: dw-genai-prod
      PROJECT_NUMBER: '101916374866'
      WORKLOAD_IDENTITY_PROVIDER: 'projects/101916374866/locations/global/workloadIdentityPools/github/providers/github-actions'
      SERVICE_ACCOUNT: 'github-runner@dw-genai-prod.iam.gserviceaccount.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Detect which components have code changes
      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            cocktail_mcp:
              - 'src/mcp_servers/cocktail_mcp_server/**'
            weather_mcp:
              - 'src/mcp_servers/weather_mcp_server/**'
            agents:
              - 'pyproject.toml'
              - 'src/a2a_agents/**'
              - 'deployment/deploy_agents.py'
            frontend:
              - 'src/frontend/**'
              - '.github/workflows/deploy.yml'
            terraform:
              - 'deployment/terraform/**'

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Retrieve persisted agent state (for Terraform when agents not redeployed)
      - name: Retrieve Agent State
        id: retrieve_state
        run: |
          ENVIRONMENT="${{ github.ref == 'refs/heads/staging' && 'staging' || 'prod' }}"
          STATE_URI="gs://${{ env.PROJECT_ID }}-terraform-state/a2a-multiagent-langgraph-cicd/${ENVIRONMENT}/agent_state.json"

          echo "Attempting to retrieve state from ${STATE_URI}"

          # Try to read state file
          if gcloud storage cat "${STATE_URI}" > /tmp/agent_state.json 2>/dev/null; then
            # Extract hosting agent resource name
            HOSTING_AGENT=$(cat /tmp/agent_state.json | jq -r '.agents.hosting.resource_name // empty')

            if [ -n "$HOSTING_AGENT" ]; then
              echo "Retrieved hosting agent from state: ${HOSTING_AGENT}"
              echo "PERSISTED_AGENT_ENGINE_ID=${HOSTING_AGENT}" >> $GITHUB_OUTPUT
            else
              echo "No hosting agent found in state file"
              echo "PERSISTED_AGENT_ENGINE_ID=" >> $GITHUB_OUTPUT
            fi
          else
            echo "State file not found (first deployment)"
            echo "PERSISTED_AGENT_ENGINE_ID=" >> $GITHUB_OUTPUT
          fi

      # 2. Deploy MCP Servers to Cloud Run (only if code changed)
      - name: Deploy Cocktail MCP Server
        if: steps.changes.outputs.cocktail_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/cocktail_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/cocktail-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy Weather MCP Server
        if: steps.changes.outputs.weather_mcp == 'true'
        run: |
          gcloud builds submit ./src/mcp_servers/weather_mcp_server \
            --tag gcr.io/${{ env.PROJECT_ID }}/weather-remote-mcp-server-lg \
            --project ${{ env.PROJECT_ID }}

      # 3. Deploy A2A Agents (when agent code changes OR when MCP servers change)
      - name: Set up Python
        if: |
          steps.changes.outputs.agents == 'true' ||
          steps.changes.outputs.cocktail_mcp == 'true' ||
          steps.changes.outputs.weather_mcp == 'true' ||
          github.event.inputs.force_deploy_all == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: |
          steps.changes.outputs.agents == 'true' ||
          steps.changes.outputs.cocktail_mcp == 'true' ||
          steps.changes.outputs.weather_mcp == 'true' ||
