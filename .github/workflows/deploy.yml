name: Deploy A2A Multiagent App

on:
  push:
    branches:
      - staging
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'assets/**'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force_deploy_all:
        description: 'Force deploy all components (ignores path filters)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      tf_prefix: staging
      force_deploy_all: ${{ inputs.force_deploy_all || false }}

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      tf_prefix: prod
      force_deploy_all: ${{ inputs.force_deploy_all || false }}
