name: Deploy A2A Multiagent App

on:
  push:
    branches:
      - staging
      - main

env:
  PROJECT_ID: dw-genai-prod
  PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}
  REGION: us-central1
  SERVICE_NAME: a2a-frontend
  PYTHON_VERSION: '3.13'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/101916374866/locations/global/workloadIdentityPools/github/providers/github-actions'
  SERVICE_ACCOUNT: 'github-runner@dw-genai-prod.iam.gserviceaccount.com'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 2. Deploy MCP Servers to Cloud Run
      - name: Deploy Cocktail MCP Server
        id: deploy_cocktail_mcp
        run: |
          gcloud run deploy cocktail-remote-mcp-server-lg \
            --source ./src/mcp_servers/cocktail_mcp_server \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --no-allow-unauthenticated \
            --platform managed \
            --format='value(status.url)' > /tmp/cocktail_mcp_url.txt
          echo "url=$(cat /tmp/cocktail_mcp_url.txt)" >> "$GITHUB_OUTPUT"

      - name: Deploy Weather MCP Server
        id: deploy_weather_mcp
        run: |
          gcloud run deploy weather-remote-mcp-server-lg \
            --source ./src/mcp_servers/weather_mcp_server \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --no-allow-unauthenticated \
            --platform managed \
            --format='value(status.url)' > /tmp/weather_mcp_url.txt
          echo "url=$(cat /tmp/weather_mcp_url.txt)" >> "$GITHUB_OUTPUT"

      # 3. Deploy A2A Agents
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Run A2A Deploy Script
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          PROJECT_NUMBER: ${{ env.PROJECT_NUMBER }}
          GOOGLE_CLOUD_REGION: ${{ env.REGION }}
          CT_MCP_SERVER_URL: '${{ steps.deploy_cocktail_mcp.outputs.url }}/mcp/'
          WEA_MCP_SERVER_URL: '${{ steps.deploy_weather_mcp.outputs.url }}/mcp/'
          PYTHONPATH: src/a2a_agents
        run: |
          uv run python deployment/deploy_agents.py

      # 4. Deploy Frontend to Cloud Run
      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./src/frontend \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --no-allow-unauthenticated \
            --platform managed
